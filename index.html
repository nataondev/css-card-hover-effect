<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Card Hover Effect</title>

    <!-- TailwindCSS 4 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@4.0.0/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex flex-col items-center justify-center overflow-hidden m-0 p-0">
    <h4 class="text-white text-3xl font-normal mb-5 -translate-y-24">Card hover effect</h4>
    <div id="cards" class="flex flex-wrap justify-center gap-4 max-w-screen-lg w-full px-4">
        <div class="card relative w-full sm:w-60 md:w-72 h-64">
            <div class="card-border"></div>
            <div class="card-content">
            </div>
        </div>
        <div class="card relative w-full sm:w-60 md:w-72 h-64">
            <div class="card-border"></div>
            <div class="card-content"></div>
        </div>
        <div class="card relative w-full sm:w-60 md:w-72 h-64">
            <div class="card-border"></div>
            <div class="card-content"></div>
        </div>
        <div class="card relative w-full sm:w-60 md:w-72 h-64">
            <div class="card-border"></div>
            <div class="card-content"></div>
        </div>
        <div class="card relative w-full sm:w-60 md:w-72 h-64">
            <div class="card-border"></div>
            <div class="card-content"></div>
        </div>
        <div class="card relative w-full sm:w-60 md:w-72 h-64">
            <div class="card-border"></div>
            <div class="card-content"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
